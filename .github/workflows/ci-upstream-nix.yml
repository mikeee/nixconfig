name: NixOS CI (upstream Nix)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-latest
          - platform: linux-arm
            runs-on: ubuntu-24.04-arm
          - platform: macos
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Maximize runner disk space
        # apt/Debian-specific cleanup; only valid on the Ubuntu runners, not macOS.
        if: ${{ runner.os == 'Linux' }}
        uses: justinthelaw/maximize-github-runner-space@bbaad53e5c844645ef54d9309adf96be46ab159e # v0.12.4
        with:
          # Remove all pre-installed toolchains/SDKs we don't need so the root
          # disk (where /nix/store lives) has room for the build. Leaves the
          # runner swapfile untouched since swapfile-size is unset.
          cleanup-profile: max
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate NixOS configurations
        run: |
          set -euo pipefail
          if [[ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          fi
          current_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          echo "Current system: $current_system"

          hosts=$(nix eval --raw --no-write-lock-file \
            --override-input dotfiles path:./stubs/dotfiles \
            --apply 'x: builtins.concatStringsSep " " (builtins.attrNames x)' \
            .#nixosConfigurations)

          for host in $hosts; do
            host_system=$(nix eval --raw --no-write-lock-file \
              --override-input dotfiles path:./stubs/dotfiles \
              ".#nixosConfigurations.${host}.pkgs.stdenv.hostPlatform.system")

            if [[ "$host_system" != "$current_system" ]]; then
              echo "Skipping $host (target $host_system != current $current_system)"
              continue
            fi

            echo "Evaluating $host..."
            nix eval --raw --no-write-lock-file \
              --override-input dotfiles path:./stubs/dotfiles \
              ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" > /dev/null
            echo "$host OK"
          done
      - name: Run Linux build tests
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'linux-arm' }}
        run: |
          set -euo pipefail
          chmod +x tests/build.sh
          ./tests/build.sh
      - name: Run WSL build test
        if: ${{ matrix.platform == 'linux' }}
        run: |
          set -euo pipefail
          if [[ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          fi
          nix build --no-write-lock-file \
            --override-input dotfiles path:./stubs/dotfiles \
            ".#nixosConfigurations.wsl.config.system.build.toplevel"
      - name: Run macOS eval smoke tests
        if: ${{ matrix.platform == 'macos' }}
        run: |
          set -euo pipefail
          nix eval --raw .#nixosConfigurations.vm-aarch64.pkgs.stdenv.hostPlatform.system
          nix eval --raw .#nixosConfigurations.vm-x86_64.pkgs.stdenv.hostPlatform.system
          nix eval --raw .#nixosConfigurations.wsl.pkgs.stdenv.hostPlatform.system
